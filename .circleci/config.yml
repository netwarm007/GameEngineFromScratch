version: 2.1
orbs:
  win: circleci/windows@4.1.1

# Branch pushes run the full scope on every platform, needing no API token.
# For iteration, trigger a pipeline through the API with `run_full: false` to
# run the quick scope (fast tests only, no screenshots, coverage or packaging)
# on `platforms`. A quick result is never acceptance.
parameters:
  run_full:
    type: boolean
    default: true
  platforms:
    type: string
    default: "windows,linux,macos"

commands:
  # Weekly cache period: each cache is saved at most once per period (an
  # existing key is never overwritten), and restores fall back to the newest
  # older period. This replaces per-commit keys that stored a full copy every push.
  cache_period_unix:
    steps:
      - run:
          name: Compute cache period
          command: |
            echo "$(date -u +%Y)-$(( 10#$(date -u +%j) / 7 ))" > /tmp/cache-period.txt
  cache_period_windows:
    steps:
      - run:
          name: Compute cache period
          command: |
            $now = (Get-Date).ToUniversalTime()
            "$($now.Year)-$([int][math]::Floor($now.DayOfYear / 7))" | Set-Content -NoNewline C:\cache-period.txt
  build_windows_dependency:
    parameters:
      dependency:
        type: string
      script:
        type: string
    steps:
      - run:
          name: "Build << parameters.dependency >>"
          command: |
            $ErrorActionPreference = 'Stop'
            if (Test-Path .circleci\windows-deps-cache\complete.txt) {
              Write-Output "Using cached << parameters.dependency >>"
            } else {
              & (Join-Path 'scripts' '<< parameters.script >>.bat')
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }

jobs:
  build_windows:
    parameters:
      scope:
        type: enum
        enum: [quick, full]
        default: full
      ctest_args:
        type: string
        default: ""
    executor:
      name: win/server-2022
      shell: powershell.exe
      size: large
    environment:
      CMAKE_BUILD_PARALLEL_LEVEL: "8"
      SCCACHE_DIR: C:/Users/circleci/sccache
      SCCACHE_CACHE_SIZE: 10G
    steps:
      - run: systeminfo
      - run:
          name: "Install CMake, Ninja, Flex and Bison"
          command: |
            $machinePath = [Environment]::GetEnvironmentVariable('Path', 'MACHINE')
            $newMachineEnvironmentPath = $machinePath
            
            # install chocolatey
            $chocolateyPath = "$env:AllUsersProfile\chocolatey\bin"
            if(Get-Command "choco" -ErrorAction SilentlyContinue)
            {
              echo "Chocolatey is already installed. Skipping installation."
            }
            else
            {
              echo "Chocolatey net present. Installing chocolatey."
              Invoke-Expression ((new-object net.webclient).DownloadString('https://chocolatey.org/install.ps1'))
              if (-not ($machinePath.ToLower().Contains($chocolateyPath.ToLower())))
              {
                echo "Adding $chocolateyPath to Path environment variable"
                $env:Path += ";$chocolateyPath"
                $newMachineEnvironmentPath += ";$chocolateyPath"
              }
              else
              {
                echo "$chocolateyPath already present in Path environment variable"
              }
            }
            
            # The project requires CMake 4 or newer.
            $cmakeVersion = [version]'0.0'
            if (Get-Command "cmake" -ErrorAction SilentlyContinue) {
              $cmakeVersion = [version]((cmake --version | Select-Object -First 1) -replace '^cmake version ', '')
            }
            if ($cmakeVersion -lt [version]'4.0') {
              choco upgrade cmake.portable -y --no-progress
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              $env:Path = "$chocolateyPath;$env:Path"
              $newMachineEnvironmentPath = "$chocolateyPath;$newMachineEnvironmentPath"
            }
            $cmakeVersion = [version]((cmake --version | Select-Object -First 1) -replace '^cmake version ', '')
            if ($cmakeVersion -lt [version]'4.0') { throw "CMake 4.0 or newer is required" }

            if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
              choco install ninja -y --no-progress
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }

            if (-not (Get-Command sccache -ErrorAction SilentlyContinue)) {
              choco install sccache -y --no-progress
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }

            # install winflexbison3
            $winflexbison3Path = "${env:ProgramFiles(x86)}\WinFlexBison\bin"
            if(Get-Command "bison" -ErrorAction SilentlyContinue)
            {
              echo "bison is already installed. Skipping installation."
            }
            else
            {
              echo "bison not present. Installing bison."
              choco install winflexbison3 -y

              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

              if (-not ($machinePath.ToLower().Contains($winflexbison3Path.ToLower())))
              {
                echo "Adding $winflexbison3Path to Path environment variable"
                $env:Path += ";$winflexbison3Path"
                $newMachineEnvironmentPath = "$winflexbison3Path;$newMachineEnvironmentPath"
              }
              else
              {
                echo "$winflexbison3Path already present in Path environment variable"
              }
            }

            # update machine environment path
            if ($newMachineEnvironmentPath -ne $machinePath)
            {
              [Environment]::SetEnvironmentVariable('Path', $newMachineEnvironmentPath, 'MACHINE')
            }

            # install NSIS for packaging
            $nsisInstalled = $false
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              choco install nsis -y --no-progress
              if ($LASTEXITCODE -eq 0) {
                $nsisInstalled = $true
                break
              }
              if ($attempt -lt 3) {
                Write-Warning "NSIS installation failed (attempt $attempt/3); retrying in 10 seconds."
                Start-Sleep -Seconds 10
              }
            }
            if (-not $nsisInstalled) { throw "NSIS installation failed after 3 attempts" }

            # install vulkan SDK
            choco install vulkan-sdk -y
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            refreshenv
            $nsisPath = Join-Path "${env:ProgramFiles(x86)}" "NSIS"
            $makensisPath = Join-Path $nsisPath "makensis.exe"
            if (-not (Test-Path -LiteralPath $makensisPath)) {
              throw "NSIS compiler was not found at $makensisPath after installation"
            }
            $env:Path = "$nsisPath;$env:Path"
      - cache_period_windows
      - restore_cache:
          keys:
            - source-v2-{{ arch }}-{{ checksum "C:/cache-period.txt" }}
            - source-v2-{{ arch }}-
      - restore_cache:
          keys:
            - sccache-windows-v1-{{ arch }}-{{ checksum "C:/cache-period.txt" }}
            - sccache-windows-v1-{{ arch }}-
      - run:
          name: restore repo
          command: |
            if (Test-Path -Path ".git" ) {
              git restore .
            }
      - checkout
      - run:
          name: init submodules
          command: |
            git submodule sync
            git submodule update --init --recursive
      - when:
          condition:
            equal: [ master, << pipeline.git.branch >> ]
          steps:
            - run:
                name: git gc
                command: |
                  git gc
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            - save_cache:
                key: source-v2-{{ arch }}-{{ checksum "C:/cache-period.txt" }}
                paths:
                  - ".git"
      - run:
          name: ISPC and C++ math regression
          command: |
            scripts/build_ispc.bat
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
            $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            if (-not $vs) { throw "Visual Studio C++ tools were not found" }
            & $env:ComSpec /c "call `"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && cmake -S Test\Runtime -B build-runtime -G Ninja -DCMAKE_BUILD_TYPE=Debug && cmake --build build-runtime --parallel 2 && ctest --test-dir build-runtime --output-on-failure"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $env:ComSpec /c "call `"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && cmake -S Test\GeomMath -B build-geommath -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build-geommath --parallel 2 && ctest --test-dir build-geommath --output-on-failure --output-junit junit.xml"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - store_test_results:
          path: build-geommath/junit.xml
      - run:
          name: Prepare Windows dependency cache key
          command: |
            cmake -DACTION=key -P .circleci/windows-dependency-cache.cmake
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - restore_cache:
          key: windows-deps-v1-{{ arch }}-{{ checksum ".circleci/windows-deps-key.txt" }}
      - run:
          name: Restore Windows dependency files
          command: |
            cmake -DACTION=restore -P .circleci/windows-dependency-cache.cmake
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run:
          name: Prepare ImGui backends
          command: |
            scripts/build_imgui
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - build_windows_dependency:
          dependency: crossguid
          script: build_crossguid
      - build_windows_dependency:
          dependency: OpenGEX
          script: build_opengex
      - build_windows_dependency:
          dependency: zlib
          script: build_zlib
      - build_windows_dependency:
          dependency: Bullet
          script: build_bullet
      - build_windows_dependency:
          dependency: glslang
          script: build_glslangValidator
      - build_windows_dependency:
          dependency: SPIRV-Cross
          script: build_spirvcross
      - build_windows_dependency:
          dependency: ISPC texture compressor
          script: build_libispc-texcomp
      - build_windows_dependency:
          dependency: OpenAL
          script: build_openal
      - run:
          name: Prepare Windows dependency cache
          command: |
            cmake -DACTION=save -P .circleci/windows-dependency-cache.cmake
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - save_cache:
          key: windows-deps-v1-{{ arch }}-{{ checksum ".circleci/windows-deps-key.txt" }}
          paths:
            - ".circleci/windows-deps-cache"
      - run:
          name: "Build Engine"
          command: |
            if (-not (Get-Command dxc.exe -ErrorAction SilentlyContinue)) {
              $dxc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter dxc.exe -Recurse |
                Where-Object { $_.DirectoryName -match '\\x64$' } |
                Sort-Object FullName -Descending | Select-Object -First 1
              if (-not $dxc) { throw "Windows SDK dxc.exe was not found" }
              $env:Path = "$($dxc.DirectoryName);$env:Path"
            }
            $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
            $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            if (-not $vs) { throw "Visual Studio C++ tools were not found" }
            & $env:ComSpec /c "call `"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DOPENGL_RHI_DEBUG=ON -DD3D12_RHI_DEBUG=ON -DBILLIARD_USE_D3D12=ON -DUSE_ENGINE_ALLOCATORS=ON -DENABLE_ALLOCATOR_TRACKING=ON -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache && cmake --build build"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            sccache --show-stats
      - run:
          name: "Cook Asset"
          command: |
            scripts/cook_material
      - run:
          name: "Test"
          command: |
            $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
            $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            if (-not $vs) { throw "Visual Studio C++ tools were not found" }
            & $env:ComSpec /c "call `"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && ctest --test-dir build -C Debug --output-on-failure --output-junit junit.xml << parameters.ctest_args >>"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - store_test_results:
          path: build/junit.xml
      - when:
          condition:
            equal: [quick, << parameters.scope >>]
          steps:
            - run: circleci-agent step halt
      - run:
          name: Capture Viewer screenshot
          when: always
          command: |
            New-Item -ItemType Directory -Force screenshots | Out-Null
            $process = $null
            try {
              $viewer = Get-ChildItem build/Viewer -Filter Viewer.exe -Recurse |
                Select-Object -First 1
              if (-not $viewer) { throw "Viewer.exe not found" }
              $env:GEFS_SCREENSHOT_PATH = Join-Path (Resolve-Path screenshots).Path "viewer-render.png"
              $process = Start-Process -FilePath $viewer.FullName -PassThru `
                -RedirectStandardOutput screenshots/viewer.log `
                -RedirectStandardError screenshots/viewer-error.log
              if (-not $process.WaitForExit(180000)) {
                throw "Viewer screenshot timed out after 180 seconds"
              }
              if (-not (Test-Path $env:GEFS_SCREENSHOT_PATH)) {
                throw "Viewer did not produce a PNG; see viewer logs (exit $($process.ExitCode))"
              }
              Add-Type -AssemblyName System.Drawing
              $image = [System.Drawing.Image]::FromFile($env:GEFS_SCREENSHOT_PATH)
              try { Write-Output "Screenshot saved: $($image.Width)x$($image.Height)" }
              finally { $image.Dispose() }
            } catch {
              $_.Exception.Message | Out-File screenshots/capture.log -Append
              Write-Output "Viewer screenshot failed; see viewer-screenshots artifacts"
            } finally {
              if ($process -and -not $process.HasExited) {
                Stop-Process -Id $process.Id
              }
              Remove-Item Env:GEFS_SCREENSHOT_PATH -ErrorAction SilentlyContinue
            }
      - run:
          name: Viewer scene replacement regression
          no_output_timeout: 10m
          command: |
            $viewer = Get-ChildItem build/Viewer -Filter Viewer.exe -Recurse |
              Select-Object -First 1
            if (-not $viewer) { throw "Viewer.exe not found" }
            foreach ($phase in 1, 2) {
              $output = "screenshots/scene-cycle-$phase"
              New-Item -ItemType Directory -Force $output | Out-Null
              $env:GEFS_SCREENSHOT_PATH = Join-Path (Resolve-Path $output).Path "viewer-render.png"
              $env:GEFS_SCREENSHOT_WAIT_FOR = Join-Path (Resolve-Path $output).Path "scene-ready"
              $process = $null
              try {
                $process = Start-Process -FilePath $viewer.FullName -PassThru `
                  -ArgumentList "-sceneCycle", "$phase" `
                  -RedirectStandardOutput "$output/viewer.log" `
                  -RedirectStandardError "$output/viewer-error.log"
                $handle = $process.Handle
                if (-not $process.WaitForExit(180000)) { throw "Scene cycle timed out" }
                $process.Refresh()
                if ($process.ExitCode -ne 0) { throw "Scene cycle exited $($process.ExitCode)" }
                if (-not (Test-Path $env:GEFS_SCREENSHOT_PATH)) { throw "Scene cycle PNG missing" }
                if (-not (Select-String -Path "$output/viewer.log" -SimpleMatch "SCENE_CYCLE_READY phase=$phase" -Quiet)) {
                  throw "Scene cycle did not reach phase $phase"
                }
              } finally {
                if ($process -and -not $process.HasExited) { Stop-Process -Id $process.Id }
                Remove-Item Env:GEFS_SCREENSHOT_PATH -ErrorAction SilentlyContinue
                Remove-Item Env:GEFS_SCREENSHOT_WAIT_FOR -ErrorAction SilentlyContinue
              }
            }
      - run:
          name: Billiard physics regression and screenshots
          no_output_timeout: 15m
          command: |
            $output = New-Item -ItemType Directory -Force billiard-screenshots
            $billiard = Get-ChildItem build/Game/Billiard -Filter BilliardGame.exe -Recurse |
              Select-Object -First 1
            if (-not $billiard) { throw "BilliardGame.exe not found" }
            $env:GEFS_SCREENSHOT_PATH = Join-Path $output.FullName "billiard-after.png"
            $env:GEFS_SCREENSHOT_WAIT_FOR = Join-Path $output.FullName "physics-passed"
            $process = Start-Process -FilePath $billiard.FullName -PassThru `
              -ArgumentList @('--rhi', 'd3d12', '-physicsRegression', ('"' + $output.FullName + '"')) `
              -RedirectStandardOutput billiard-screenshots/billiard.log `
              -RedirectStandardError billiard-screenshots/billiard-error.log
            $handle = $process.Handle
            try {
              if (-not $process.WaitForExit(600000)) { throw "Billiard regression timed out" }
              $process.Refresh()
              if ($process.ExitCode -ne 0) { throw "Billiard regression failed; see billiard logs" }
              if (-not (Test-Path billiard-screenshots/physics-passed)) { throw "Physics result missing" }
              if (-not (Test-Path $env:GEFS_SCREENSHOT_PATH)) { throw "Billiard screenshot missing" }
              Add-Type -AssemblyName System.Drawing
              $image = [System.Drawing.Image]::FromFile($env:GEFS_SCREENSHOT_PATH)
              try { Write-Output "Billiard screenshot: $($image.Width)x$($image.Height)" }
              finally { $image.Dispose() }
            } finally {
              if (-not $process.HasExited) { Stop-Process -Id $process.Id }
              Remove-Item Env:GEFS_SCREENSHOT_PATH -ErrorAction SilentlyContinue
              Remove-Item Env:GEFS_SCREENSHOT_WAIT_FOR -ErrorAction SilentlyContinue
            }
      - when:
          condition:
            equal: [<< parameters.scope >>, full]
          steps:
            - run:
                name: Viewer startup matrix and capture comparison
                no_output_timeout: 30m
                command: |
                  $ErrorActionPreference = 'Stop'
                  choco install python3 -y --no-progress
                  $env:Path = [Environment]::GetEnvironmentVariable('Path','Machine') + ';' + [Environment]::GetEnvironmentVariable('Path','User')
                  $baseline = 'screenshots/viewer-render.png'
                  if (-not (Test-Path $baseline)) { throw 'Baseline Viewer capture missing' }
                  $viewer = Get-ChildItem build/Viewer -Filter Viewer.exe -Recurse | Select-Object -First 1
                  if (-not $viewer) { throw 'Viewer.exe not found' }
                  $viewerDir = $viewer.DirectoryName

                  # Mesa software drivers (llvmpipe OpenGL, lavapipe Vulkan) for the matrix.
                  $mesa = Join-Path $env:TEMP 'mesa-matrix'
                  New-Item -ItemType Directory -Force $mesa | Out-Null
                  $archive = Join-Path $mesa 'mesa.7z'
                  Invoke-WebRequest 'https://github.com/pal1000/mesa-dist-win/releases/download/26.3.0/mesa3d-26.3.0-release-msvc.7z' -OutFile $archive
                  if ((Get-Item $archive).Length -lt 50MB) { throw 'Mesa archive download too small' }
                  $sevenZip = 'C:\Program Files\7-Zip\7z.exe'
                  if (-not (Test-Path $sevenZip)) { choco install 7zip -y --no-progress }
                  & $sevenZip x $archive "-o$mesa\extracted" -y | Out-Null
                  if ($LASTEXITCODE -ne 0) { throw 'Mesa archive extraction failed' }
                  function Find-MesaFile($name) {
                    $all = Get-ChildItem "$mesa\extracted" -Recurse -Filter $name
                    $x64 = $all | Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1
                    if ($x64) { return $x64 }
                    return ($all | Select-Object -First 1)
                  }
                  foreach ($name in @('opengl32.dll','libgallium_wgl.dll','dxil.dll')) {
                    $f = Find-MesaFile $name
                    if ($f) { Copy-Item $f.FullName $viewerDir -Force }
                  }
                  # The Vulkan loader is the system one (the SDK installer
                  # refreshes System32; the side-by-side SDK tree ships no
                  # vulkan-1.dll). Mesa provides only the lavapipe ICD.
                  $sysLoader = "$env:SystemRoot\System32\vulkan-1.dll"
                  if (Test-Path $sysLoader) {
                    Write-Output "System32 Vulkan loader version: $((Get-Item $sysLoader).VersionInfo.FileVersion)"
                  } else {
                    throw 'System32 Vulkan loader missing'
                  }
                  if ($env:VULKAN_SDK -and (Test-Path "$env:VULKAN_SDK\Bin\vulkan-1.dll")) {
                    $env:GEFS_VULKAN_LIBRARY = "$env:VULKAN_SDK\Bin\vulkan-1.dll"
                    Write-Output "Using SDK loader override: $env:GEFS_VULKAN_LIBRARY"
                  }
                  $lvp = Find-MesaFile 'vulkan_lvp.dll'
                  $icd = Get-ChildItem "$mesa\extracted" -Recurse -Filter 'lvp_icd.x86_64.json' | Select-Object -First 1
                  if (-not ($lvp -and $icd)) {
                    Get-ChildItem "$mesa\extracted" -Recurse -Directory | Select-Object -First 20 -ExpandProperty FullName
                    throw 'Mesa lavapipe components not found in package'
                  }
                  # Deploy the lavapipe ICD together with every sibling DLL next
                  # to the executable: the application directory is first in the
                  # Windows DLL search order, so the ICD's dependencies resolve.
                  # Copying vulkan_lvp.dll alone previously left it unable to load.
                  Get-ChildItem $lvp.DirectoryName -Filter '*.dll' | ForEach-Object { Copy-Item $_.FullName $viewerDir -Force }
                  $json = Get-Content $icd.FullName -Raw | ConvertFrom-Json
                  $json.ICD.library_path = (Join-Path $viewerDir 'vulkan_lvp.dll')
                  # ASCII (no BOM) so the loader's JSON parser accepts the file.
                  $json | ConvertTo-Json -Depth 10 | Set-Content "$mesa\lvp_icd.json" -Encoding ascii
                  [Environment]::SetEnvironmentVariable('VK_ICD_FILENAMES', "$mesa\lvp_icd.json", 'Machine')
                  $env:VK_ICD_FILENAMES = "$mesa\lvp_icd.json"
                  Write-Output "lavapipe ICD json:"; Get-Content "$mesa\lvp_icd.json"
                  # The CI executor runs elevated, and the Vulkan loader ignores
                  # VK_ICD_FILENAMES/VK_DRIVER_FILES under elevated permissions,
                  # reading only the registry. Register the ICD machine-wide in
                  # the 64-bit view so the 64-bit loader discovers lavapipe.
                  $hive = [Microsoft.Win32.RegistryKey]::OpenBaseKey([Microsoft.Win32.RegistryHive]::LocalMachine, [Microsoft.Win32.RegistryView]::Registry64)
                  $key = $hive.CreateSubKey('SOFTWARE\Khronos\Vulkan\Drivers')
                  $key.SetValue("$mesa\lvp_icd.json", 0, [Microsoft.Win32.RegistryValueKind]::DWord)
                  $key.Close(); $hive.Close()
                  Write-Output "Registered lavapipe ICD (64-bit view) HKLM\SOFTWARE\Khronos\Vulkan\Drivers: $mesa\lvp_icd.json"
                  # Diagnostic: confirm the ICD loads and which instance extensions
                  # it exposes before the Viewer run.
                  $vulkaninfo = Get-ChildItem 'C:\VulkanSDK' -Recurse -Filter 'vulkaninfo.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
                  if ($vulkaninfo) {
                    $env:VK_LOADER_DEBUG = 'all'
                    & $vulkaninfo.FullName --summary *> "$mesa\vulkaninfo.log"
                    Remove-Item Env:VK_LOADER_DEBUG -ErrorAction SilentlyContinue
                    Write-Output '=== vulkaninfo lavapipe/ICD diagnostics ==='
                    Get-Content "$mesa\vulkaninfo.log" | Where-Object { $_ -match 'lvp|lavapipe|ICD|ERROR|error|deviceName|VK_KHR_get_surface_capabilities2|VK_KHR_win32_surface' } | Select-Object -First 50
                  } else {
                    Write-Output 'vulkaninfo.exe not found in SDK; skipping ICD diagnostic'
                  }

                  function Run-Viewer($backend, $outDir) {
                    New-Item -ItemType Directory -Force $outDir | Out-Null
                    $resolved = (Resolve-Path $outDir).Path
                    $ext = 'png'
                    if ($backend -eq 'vulkan') { $ext = 'ppm' }
                    $png = Join-Path $resolved "viewer-render.$ext"
                    if ($backend -eq 'opengl') {
                      $env:GALLIUM_DRIVER = 'llvmpipe'
                      $env:LIBGL_ALWAYS_SOFTWARE = '1'
                    }
                    if ($backend -eq 'vulkan') {
                      # Loader debug reveals whether the lavapipe ICD loads and
                      # which instance extensions it exposes (stderr is captured).
                      $env:VK_LOADER_DEBUG = 'all'
                    }
                    # All three backends honor GEFS_SCREENSHOT_PATH self-capture
                    # (the Win32 OpenGL host reads the presented front buffer in
                    # its main loop); no visible interactive desktop is needed.
                    $env:GEFS_SCREENSHOT_PATH = $png
                    $proc = Start-Process -FilePath $viewer.FullName -ArgumentList @('--rhi',$backend) -PassThru -RedirectStandardOutput "$outDir/viewer.log" -RedirectStandardError "$outDir/viewer-error.log"
                    try {
                      if (-not $proc.WaitForExit(240000)) { throw "$backend matrix run timed out" }
                    } finally {
                      # A live child keeps the step console open and would trip
                      # the no-output timeout; always reap it.
                      Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
                      Wait-Process -Id $proc.Id -ErrorAction SilentlyContinue
                      Remove-Item Env:GEFS_SCREENSHOT_PATH -ErrorAction SilentlyContinue
                      if ($backend -eq 'opengl') {
                        Remove-Item Env:GALLIUM_DRIVER -ErrorAction SilentlyContinue
                        Remove-Item Env:LIBGL_ALWAYS_SOFTWARE -ErrorAction SilentlyContinue
                      }
                      if ($backend -eq 'vulkan') {
                        Remove-Item Env:VK_LOADER_DEBUG -ErrorAction SilentlyContinue
                      }
                    }
                    # Self-capture paths may exit nonzero after a successful
                    # save (the baseline capture step also asserts the file,
                    # not the exit code); the capture itself is the assertion.
                    if (-not (Test-Path $png)) {
                      Get-Content "$outDir/viewer.log" -ErrorAction SilentlyContinue
                      Write-Output "=== $backend loader/stderr diagnostics ==="
                      Get-Content "$outDir/viewer-error.log" -ErrorAction SilentlyContinue |
                        Where-Object { $_ -match 'lvp|lavapipe|icd|ICD|ERROR|error|surface|Surface|extension|Extension|driver|Driver|Cannot|cannot|fail|Fail' } |
                        Select-Object -First 80
                      throw "$backend matrix capture missing"
                    }
                    $tolArgs = @()
                    if ($backend -ne 'd3d12') { $tolArgs = @('--max-diff-fraction','0.40','--max-high-delta-fraction','0.02') }
                    python scripts/compare_captures.py $baseline $png --label "windows-$backend" @tolArgs
                    if ($LASTEXITCODE -ne 0) { throw "windows-$backend capture comparison failed" }
                  }
                  Run-Viewer 'd3d12' 'screenshots/matrix/d3d12'
                  Run-Viewer 'opengl' 'screenshots/matrix/opengl'
                  Run-Viewer 'vulkan' 'screenshots/matrix/vulkan'
      - run:
          name: Billiard per-backend startup matrix
          no_output_timeout: 20m
          command: |
            $ErrorActionPreference = 'Stop'
            $billiard = Get-ChildItem build/Game/Billiard -Filter BilliardGame.exe -Recurse | Select-Object -First 1
            if (-not $billiard) { throw 'BilliardGame.exe not found' }
            $billiardDir = $billiard.DirectoryName
            # Deploy the mesa software drivers next to Billiard too (the Viewer
            # matrix deployed them only next to Viewer). Reuse the extracted package.
            $mesa = Join-Path $env:TEMP 'mesa-matrix'
            foreach ($name in @('opengl32.dll','libgallium_wgl.dll','dxil.dll')) {
              $f = Get-ChildItem "$mesa\extracted" -Recurse -Filter $name -ErrorAction SilentlyContinue |
                Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1
              if ($f) { Copy-Item $f.FullName $billiardDir -Force }
            }
            $lvp = Get-ChildItem "$mesa\extracted" -Recurse -Filter 'vulkan_lvp.dll' -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1
            if ($lvp) {
              Get-ChildItem $lvp.DirectoryName -Filter '*.dll' | ForEach-Object { Copy-Item $_.FullName $billiardDir -Force }
              $icd = Get-ChildItem "$mesa\extracted" -Recurse -Filter 'lvp_icd.x86_64.json' | Select-Object -First 1
              $json = Get-Content $icd.FullName -Raw | ConvertFrom-Json
              $json.ICD.library_path = (Join-Path $billiardDir 'vulkan_lvp.dll')
              $json | ConvertTo-Json -Depth 10 | Set-Content "$mesa\lvp_icd_billiard.json" -Encoding ascii
              $hive = [Microsoft.Win32.RegistryKey]::OpenBaseKey([Microsoft.Win32.RegistryHive]::LocalMachine, [Microsoft.Win32.RegistryView]::Registry64)
              $key = $hive.CreateSubKey('SOFTWARE\Khronos\Vulkan\Drivers')
              $key.SetValue("$mesa\lvp_icd_billiard.json", 0, [Microsoft.Win32.RegistryValueKind]::DWord)
              $key.Close(); $hive.Close()
            }
            function Run-Billiard($backend, $outDir) {
              New-Item -ItemType Directory -Force $outDir | Out-Null
              $resolved = (Resolve-Path $outDir).Path
              $shot = $null
              if ($backend -eq 'd3d12') { $shot = Join-Path $resolved 'billiard.png' }
              if ($backend -eq 'vulkan') { $shot = Join-Path $resolved 'billiard.ppm' }
              if ($shot) { $env:GEFS_SCREENSHOT_PATH = $shot }
              else { Remove-Item Env:GEFS_SCREENSHOT_PATH -ErrorAction SilentlyContinue }
              $env:GEFS_SCREENSHOT_WAIT_FOR = Join-Path $resolved 'physics-passed'
              if ($backend -eq 'opengl') { $env:GALLIUM_DRIVER = 'llvmpipe'; $env:LIBGL_ALWAYS_SOFTWARE = '1' }
              $proc = Start-Process -FilePath $billiard.FullName -ArgumentList @('--rhi',$backend,'-physicsRegression',$resolved) -PassThru -RedirectStandardOutput "$outDir/billiard.log" -RedirectStandardError "$outDir/billiard-error.log"
              # Retain the process handle so ExitCode is readable after exit.
              $null = $proc.Handle
              try {
                if (-not $proc.WaitForExit(600000)) { throw "$backend billiard timed out" }
                $proc.Refresh()
                if ($proc.ExitCode -ne 0) {
                  Get-Content "$outDir/billiard.log","$outDir/billiard-error.log" -ErrorAction SilentlyContinue
                  throw "$backend billiard regression failed (exit $($proc.ExitCode))"
                }
              } finally {
                Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
                Wait-Process -Id $proc.Id -ErrorAction SilentlyContinue
                Remove-Item Env:GEFS_SCREENSHOT_PATH -ErrorAction SilentlyContinue
                Remove-Item Env:GEFS_SCREENSHOT_WAIT_FOR -ErrorAction SilentlyContinue
                if ($backend -eq 'opengl') {
                  Remove-Item Env:GALLIUM_DRIVER -ErrorAction SilentlyContinue
                  Remove-Item Env:LIBGL_ALWAYS_SOFTWARE -ErrorAction SilentlyContinue
                }
              }
              if (-not (Test-Path (Join-Path $resolved 'physics-passed'))) { throw "$backend physics-passed missing" }
              if ($shot) { if (-not (Test-Path $shot)) { throw "$backend capture missing" } }
              elseif (-not (Test-Path (Join-Path $resolved 'billiard-after.bmp'))) { throw "$backend BMP capture missing" }
              Write-Output "windows-billiard-${backend}: startup + physics + capture OK"
            }
            Run-Billiard 'd3d12' 'billiard-matrix/d3d12'
            Run-Billiard 'opengl' 'billiard-matrix/opengl'
            Run-Billiard 'vulkan' 'billiard-matrix/vulkan'
      - run:
          name: Same-backend reconstruction matrix
          no_output_timeout: 30m
          command: |
            $ErrorActionPreference = 'Stop'
            $env:Path = [Environment]::GetEnvironmentVariable('Path','Machine') + ';' + [Environment]::GetEnvironmentVariable('Path','User')
            $baseline = 'screenshots/viewer-render.png'
            if (-not (Test-Path $baseline)) { throw 'Baseline Viewer capture missing' }
            $viewer = Get-ChildItem build/Viewer -Filter Viewer.exe -Recurse | Select-Object -First 1
            $billiard = Get-ChildItem build/Game/Billiard -Filter BilliardGame.exe -Recurse | Select-Object -First 1
            if (-not ($viewer -and $billiard)) { throw 'Application executables not found' }
            # Mesa software drivers and the lavapipe ICD registry entry were
            # deployed by the startup matrix steps and persist machine-wide.
            # Two same-backend destroy/recreate cycles run after the first
            # presented frame; the capture must still match the startup
            # baseline (CPU scene preserved, GPU resources rebuilt).
            foreach ($backend in @('d3d12','opengl','vulkan')) {
              $out = "screenshots/reconstruct/$backend"
              New-Item -ItemType Directory -Force $out | Out-Null
              $resolved = (Resolve-Path $out).Path
              $ext = 'png'; if ($backend -eq 'vulkan') { $ext = 'ppm' }
              $png = Join-Path $resolved "viewer-render.$ext"
              if ($backend -eq 'opengl') { $env:GALLIUM_DRIVER = 'llvmpipe'; $env:LIBGL_ALWAYS_SOFTWARE = '1' }
              $env:GEFS_SCREENSHOT_PATH = $png
              $proc = Start-Process -FilePath $viewer.FullName -ArgumentList @('--rhi',$backend,'--rhi-reconstruct','2') -PassThru -RedirectStandardOutput "$out/viewer.log" -RedirectStandardError "$out/viewer-error.log"
              try {
                if (-not $proc.WaitForExit(240000)) { throw "$backend viewer reconstruction timed out" }
              } finally {
                Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
                Wait-Process -Id $proc.Id -ErrorAction SilentlyContinue
                Remove-Item Env:GEFS_SCREENSHOT_PATH -ErrorAction SilentlyContinue
                if ($backend -eq 'opengl') {
                  Remove-Item Env:GALLIUM_DRIVER -ErrorAction SilentlyContinue
                  Remove-Item Env:LIBGL_ALWAYS_SOFTWARE -ErrorAction SilentlyContinue
                }
              }
              if (-not (Test-Path $png)) {
                Get-Content "$out/viewer.log","$out/viewer-error.log" -ErrorAction SilentlyContinue | Select-Object -First 60
                throw "$backend reconstruction capture missing"
              }
              if (-not (Select-String -Path "$out/viewer.log" -Pattern 'RHI session reconstructed \(cycle 2\)' -Quiet)) {
                throw "$backend reconstruction cycles did not run"
              }
              $tolArgs = @()
              if ($backend -ne 'd3d12') { $tolArgs = @('--max-diff-fraction','0.40','--max-high-delta-fraction','0.02') }
              python scripts/compare_captures.py $baseline $png --label "windows-reconstruct-$backend" @tolArgs
              if ($LASTEXITCODE -ne 0) { throw "windows-reconstruct-$backend capture comparison failed" }
            }
            foreach ($backend in @('d3d12','opengl','vulkan')) {
              $out = "billiard-reconstruct/$backend"
              New-Item -ItemType Directory -Force $out | Out-Null
              $resolved = (Resolve-Path $out).Path
              $shot = $null
              if ($backend -eq 'd3d12') { $shot = Join-Path $resolved 'billiard.png' }
              if ($backend -eq 'vulkan') { $shot = Join-Path $resolved 'billiard.ppm' }
              if ($shot) { $env:GEFS_SCREENSHOT_PATH = $shot }
              else { Remove-Item Env:GEFS_SCREENSHOT_PATH -ErrorAction SilentlyContinue }
              $env:GEFS_SCREENSHOT_WAIT_FOR = Join-Path $resolved 'physics-passed'
              if ($backend -eq 'opengl') { $env:GALLIUM_DRIVER = 'llvmpipe'; $env:LIBGL_ALWAYS_SOFTWARE = '1' }
              $proc = Start-Process -FilePath $billiard.FullName -ArgumentList @('--rhi',$backend,'--rhi-reconstruct','2','-physicsRegression',$resolved) -PassThru -RedirectStandardOutput "$out/billiard.log" -RedirectStandardError "$out/billiard-error.log"
              $null = $proc.Handle
              try {
                if (-not $proc.WaitForExit(600000)) { throw "$backend billiard reconstruction timed out" }
                $proc.Refresh()
                if ($proc.ExitCode -ne 0) {
                  Get-Content "$out/billiard.log","$out/billiard-error.log" -ErrorAction SilentlyContinue | Select-Object -First 60
                  throw "$backend billiard reconstruction failed (exit $($proc.ExitCode))"
                }
              } finally {
                Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
                Wait-Process -Id $proc.Id -ErrorAction SilentlyContinue
                Remove-Item Env:GEFS_SCREENSHOT_PATH -ErrorAction SilentlyContinue
                Remove-Item Env:GEFS_SCREENSHOT_WAIT_FOR -ErrorAction SilentlyContinue
                if ($backend -eq 'opengl') {
                  Remove-Item Env:GALLIUM_DRIVER -ErrorAction SilentlyContinue
                  Remove-Item Env:LIBGL_ALWAYS_SOFTWARE -ErrorAction SilentlyContinue
                }
              }
              if (-not (Test-Path (Join-Path $resolved 'physics-passed'))) { throw "$backend reconstruction physics-passed missing" }
              if ($shot) { if (-not (Test-Path $shot)) { throw "$backend reconstruction capture missing" } }
              elseif (-not (Test-Path (Join-Path $resolved 'billiard-after.bmp'))) { throw "$backend reconstruction BMP capture missing" }
              if (-not (Select-String -Path "$out/billiard.log" -Pattern 'RHI session reconstructed \(cycle 2\)' -Quiet)) {
                throw "$backend billiard reconstruction cycles did not run"
              }
              Write-Output "windows-billiard-reconstruct-${backend}: reconstruction + physics + capture OK"
            }
      - store_artifacts:
          path: billiard-reconstruct
          destination: billiard-reconstruct
      - run:
          name: RHI selection diagnostics smoke
          command: |
            $viewer = Get-ChildItem build/Viewer -Filter Viewer.exe -Recurse | Select-Object -First 1
            & $viewer.FullName --list-rhi | Tee-Object -FilePath rhi-list.txt
            if ($LASTEXITCODE -ne 0) { throw '--list-rhi failed' }
            if (-not (Select-String -Path rhi-list.txt -Pattern 'opengl' -Quiet)) { throw '--list-rhi missing opengl' }
            & $viewer.FullName --rhi bogus *> rhi-unknown.txt
            if ($LASTEXITCODE -eq 0) { throw 'invalid --rhi unexpectedly succeeded' }
            if (-not (Select-String -Path rhi-unknown.txt -Pattern "Unknown RHI 'bogus'" -Quiet)) { throw 'missing unknown-RHI diagnostic' }
            & $viewer.FullName --rhi opengl --rhi vulkan *> rhi-dup.txt
            if ($LASTEXITCODE -eq 0) { throw 'repeated --rhi unexpectedly succeeded' }
            if (-not (Select-String -Path rhi-dup.txt -Pattern 'only once' -Quiet)) { throw 'missing repeated-RHI diagnostic' }
      - store_artifacts:
          path: billiard-matrix
          destination: billiard-matrix
      - store_artifacts:
          path: billiard-screenshots
          destination: billiard-screenshots
      - store_artifacts:
          path: screenshots
          destination: viewer-screenshots
      - when:
          condition:
            or:
              - equal: [ master, << pipeline.git.branch >> ]
              - << pipeline.git.tag >>
          steps:
          - run:
              name: Package
              command: |
                 cmake --build ./build --target package
          - persist_to_workspace:
              root: build
              paths:
                - GEFS-0.1.0-win64.exe
          - store_artifacts:
              path: build/GEFS-0.1.0-win64.exe
      - when:
          condition:
            equal: [full, << parameters.scope >>]
          steps:
            - restore_cache:
                key: windows-deps-release-v1-{{ arch }}-{{ checksum ".circleci/windows-deps-key.txt" }}
            - run:
                name: "Build Windows dependencies (Release)"
                command: |
                  $ErrorActionPreference = 'Stop'
                  if (Test-Path .circleci\windows-deps-cache-release\complete.txt) {
                    Write-Output "Using cached Release dependencies"
                    cmake -DACTION=restore -DCONFIG=Release -P .circleci/windows-dependency-cache.cmake
                    if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                  } else {
                    scripts/build_crossguid Release
                    if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                    scripts/build_opengex Release
                    if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                    scripts/build_zlib Release
                    if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                    scripts/build_bullet Release
                    if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                    scripts/build_glslangValidator Release
                    if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                    scripts/build_spirvcross Release
                    if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                    scripts/build_libispc-texcomp Release
                    if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                    scripts/build_openal Release
                    if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                    cmake -DACTION=save -DCONFIG=Release -P .circleci/windows-dependency-cache.cmake
                    if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                  }
            - save_cache:
                key: windows-deps-release-v1-{{ arch }}-{{ checksum ".circleci/windows-deps-key.txt" }}
                paths:
                  - ".circleci/windows-deps-cache-release"
            - run:
                name: "Build Engine (Release)"
                command: |
                  if (-not (Get-Command dxc.exe -ErrorAction SilentlyContinue)) {
                    $dxc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter dxc.exe -Recurse |
                      Where-Object { $_.DirectoryName -match '\\x64$' } |
                      Sort-Object FullName -Descending | Select-Object -First 1
                    if (-not $dxc) { throw "Windows SDK dxc.exe was not found" }
                    $env:Path = "$($dxc.DirectoryName);$env:Path"
                  }
                  $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
                  $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
                  if (-not $vs) { throw "Visual Studio C++ tools were not found" }
                  & $env:ComSpec /c "call `"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && cmake -S . -B build-release -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DOPENGL_RHI_DEBUG=OFF -DD3D12_RHI_DEBUG=OFF -DBILLIARD_USE_D3D12=ON -DUSE_ENGINE_ALLOCATORS=ON -DENABLE_ALLOCATOR_TRACKING=ON -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache && cmake --build build-release"
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                  sccache --show-stats
            - when:
                condition:
                  equal: [ master, << pipeline.git.branch >> ]
                steps:
                  - save_cache:
                      key: sccache-windows-v1-{{ arch }}-{{ checksum "C:/cache-period.txt" }}
                      paths:
                        - "C:/Users/circleci/sccache"
            - run:
                name: "Test (Release)"
                command: |
                  $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
                  $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
                  if (-not $vs) { throw "Visual Studio C++ tools were not found" }
                  & $env:ComSpec /c "call `"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && ctest --test-dir build-release -C Release --output-on-failure --output-junit junit.xml"
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            - store_test_results:
                path: build-release/junit.xml
  build_linux:
    parameters:
      scope:
        type: enum
        enum: [quick, full]
        default: full
      ctest_args:
        type: string
        default: ""
    environment:
      CCACHE_MAXSIZE: 2G
      CCACHE_BASEDIR: /home/circleci/project
    machine:
      image: ubuntu-2404:2026.10.1
    resource_class: large
    steps:
      - run: 
          name: Install Dependencies
          command: |
             sudo apt-get -o Acquire::Retries=3 update
             sudo apt-get -o Acquire::Retries=3 install -y --fix-missing curl clang python3-pip ninja-build git uuid-dev
             sudo apt-get -o Acquire::Retries=3 install -y --fix-missing libx11-dev libx11-xcb-dev libgl1-mesa-dev libvulkan-dev libnss3-dev libxss-dev libatk1.0-dev libatk-bridge2.0-dev libglib2.0-dev libpango1.0-dev libxi-dev libfontconfig1-dev libnspr4-dev libxcomposite-dev libxcursor-dev libxrender-dev libxtst-dev libxrandr-dev libdbus-1-dev libasound2-dev libcups2-dev libncurses-dev libsdl2-dev
             sudo apt-get -o Acquire::Retries=3 install -y --fix-missing flex bison ccache
             sudo apt-get -o Acquire::Retries=3 install -y --fix-missing xvfb xauth mesa-utils libgl1-mesa-dri imagemagick
             # Vulkan runtime (lavapipe) and validation layers for the startup
             # matrix; parity with the specialized Vulkan job's environment.
             sudo apt-get -o Acquire::Retries=3 install -y --fix-missing mesa-vulkan-drivers vulkan-validationlayers spirv-tools
             curl -s https://packagecloud.io/install/repositories/github/git-lfs/script.deb.sh | sudo bash
             sudo apt-get -o Acquire::Retries=3 install -y --fix-missing git-lfs
             python3 -m pip install --user 'cmake>=4.0,<5'
             echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$BASH_ENV"
          environment:
             DEBIAN_FRONTEND: noninteractive
      - cache_period_unix
      - restore_cache:
          keys:
            - ccache-linux-v2-{{ arch }}-{{ checksum "/tmp/cache-period.txt" }}
            - ccache-linux-v2-{{ arch }}-
      - restore_cache:
          keys:
            - source-v2-{{ arch }}-{{ checksum "/tmp/cache-period.txt" }}
            - source-v2-{{ arch }}-
      - run:
          name: restore repo
          command: |
            if [ -d ".git" ]; then
              git restore .
            fi
      - checkout
      - run:
          name: init submodules
          command: |
            git submodule sync
            git submodule update --init --recursive
      - when:
          condition:
            equal: [ master, << pipeline.git.branch >> ]
          steps:
            - run:
                name: git gc
                command: |
                  git gc
            - save_cache:
                key: source-v2-{{ arch }}-{{ checksum "/tmp/cache-period.txt" }}
                paths:
                  - ".git"
      - run:
          name: ISPC and C++ math regression
          command: |
             cmake -S Test/Runtime -B build-runtime -G Ninja -DCMAKE_BUILD_TYPE=Debug
             cmake --build build-runtime --parallel 2
             ctest --test-dir build-runtime --output-on-failure
             ./scripts/build_ispc.sh
             cmake -S Test/GeomMath -B build-geommath -G Ninja -DCMAKE_BUILD_TYPE=Release
             cmake --build build-geommath --parallel 2
             ctest --test-dir build-geommath --output-on-failure --output-junit junit.xml
      - store_test_results:
          path: build-geommath/junit.xml
      - run:
          name: "Build Dependencies"
          command: |
             ./scripts/build_imgui.sh
             ./scripts/build_crossguid.sh
             ./scripts/build_opengex.sh
             ./scripts/build_bullet.sh
             ./scripts/build_glslangValidator.sh
             ./scripts/build_spirvcross.sh
             ./scripts/build_libispc-texcomp.sh
             ./scripts/build_openal.sh
      - run:
          name: "Build Engine"
          command: |
             CMAKE_ARGS="-DUSE_ENGINE_ALLOCATORS=ON -DENABLE_ALLOCATOR_TRACKING=ON -DVULKAN_RHI_TESTS=ON -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache" ./scripts/build-ninja.sh
      - when:
          condition:
            equal: [ master, << pipeline.git.branch >> ]
          steps:
            - save_cache:
                key: ccache-linux-v2-{{ arch }}-{{ checksum "/tmp/cache-period.txt" }}
                paths:
                  - ~/.cache/ccache
      - run:
          name: "Cook Asset"
          command: |
            scripts/cook_material.sh
      - run:
          name: Test
          command: |
             # VULKAN_RHI_TESTS adds native-presentation Vulkan tests that need an
             # X display plus the lavapipe ICD and validation layers.
             lvp=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json 2>/dev/null | head -n1)
             if [ -n "$lvp" ]; then export VK_ICD_FILENAMES="$lvp"; fi
             export VK_LAYER_PATH=/usr/share/vulkan/explicit_layer.d
             xvfb-run -a ctest --test-dir ./build --output-on-failure --output-junit junit.xml << parameters.ctest_args >>
      - store_test_results:
          path: build/junit.xml
      - when:
          condition:
            equal: [quick, << parameters.scope >>]
          steps:
            - run: circleci-agent step halt
      - run:
          name: RHI selection diagnostics smoke
          command: |
             export LD_LIBRARY_PATH="$PWD/External/Linux/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
             ./build/Viewer/Viewer --list-rhi | tee rhi-list.txt
             grep -q "opengl" rhi-list.txt
             if ./build/Viewer/Viewer --rhi bogus > rhi-unknown.txt 2>&1; then
               echo "invalid --rhi unexpectedly succeeded"; exit 1; fi
             grep -q "Unknown RHI 'bogus'" rhi-unknown.txt
             if ./build/Viewer/Viewer --rhi opengl --rhi vulkan > rhi-dup.txt 2>&1; then
               echo "repeated --rhi unexpectedly succeeded"; exit 1; fi
             grep -q "only once" rhi-dup.txt
      - run:
          name: Capture Viewer screenshot
          when: always
          command: |
             mkdir -p screenshots
             if ! LIBGL_ALWAYS_SOFTWARE=1 timeout --kill-after=5s 180s \
               xvfb-run -a -s "-screen 0 1280x1024x24 +extension GLX" \
               bash scripts/capture_viewer_linux.sh screenshots \
               > screenshots/capture.log 2>&1; then
               echo "Viewer screenshot failed; see viewer-screenshots/capture.log and viewer.log"
             fi
      - run:
          name: Viewer scene replacement regression
          no_output_timeout: 10m
          command: |
             for phase in 1 2; do
               output="screenshots/scene-cycle-$phase"
               mkdir -p "$output"
               GEFS_SCREENSHOT_WAIT_FOR="$PWD/$output/scene-ready" \
               LIBGL_ALWAYS_SOFTWARE=1 timeout --kill-after=5s 180s \
                 xvfb-run -a -s "-screen 0 1280x1024x24 +extension GLX" \
                 bash scripts/capture_viewer_linux.sh "$output" -sceneCycle "$phase" \
                 > "$output/capture.log" 2>&1
               grep -q "SCENE_CYCLE_READY phase=$phase" "$output/viewer.log"
               test -s "$output/viewer-render.png"
             done
      - run:
          name: Billiard physics regression and screenshots
          no_output_timeout: 15m
          command: |
             mkdir -p billiard-screenshots
             LIBGL_ALWAYS_SOFTWARE=1 timeout --kill-after=5s 720s \
               xvfb-run -a -s "-screen 0 1280x1024x24 +extension GLX" \
               bash scripts/capture_billiard_linux.sh billiard-screenshots \
               > billiard-screenshots/capture.log 2>&1
      - when:
          condition:
            equal: [<< parameters.scope >>, full]
          steps:
            - run:
                name: Viewer startup matrix and capture comparison
                no_output_timeout: 15m
                command: |
                   set -e
                   baseline="screenshots/viewer-render.png"
                   test -s "$baseline"
                   out="screenshots/matrix/opengl"; mkdir -p "$out"
                   LIBGL_ALWAYS_SOFTWARE=1 timeout --kill-after=5s 180s \
                     xvfb-run -a -s "-screen 0 1280x1024x24 +extension GLX" \
                     bash scripts/capture_viewer_linux.sh "$out" --rhi opengl \
                     > "$out/capture.log" 2>&1 || { cat "$out/capture.log" "$out/viewer.log" 2>/dev/null; exit 1; }
                   out="screenshots/matrix/vulkan"; mkdir -p "$out"
                   lvp=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json 2>/dev/null | head -n1)
                   if [ -n "$lvp" ]; then export VK_ICD_FILENAMES="$lvp"; fi
                   export VK_LAYER_PATH=/usr/share/vulkan/explicit_layer.d
                   timeout --kill-after=5s 240s \
                     xvfb-run -a -s "-screen 0 1280x1024x24 +extension GLX" \
                     ./build/Viewer/Viewer --rhi vulkan -screenshot "$PWD/$out/viewer-render.ppm" \
                     > "$out/viewer.log" 2>&1 || true
                   if [ ! -s "$out/viewer-render.ppm" ]; then
                     echo "=== linux-vulkan viewer.log ==="
                     cat "$out/viewer.log" || true
                     exit 1
                   fi
                   grep -q "Vulkan application framebuffer capture saved:" "$out/viewer.log"
                   python3 scripts/compare_captures.py "$baseline" screenshots/matrix/opengl/viewer-render.png --label linux-opengl
                   # lavapipe vs llvmpipe: broad low-amplitude rasterizer deltas
                   # (measured 29.2% pixels, mean delta 4.7); the high-delta and
                   # mean-delta guards still reject structural divergence.
                   python3 scripts/compare_captures.py "$baseline" screenshots/matrix/vulkan/viewer-render.ppm --label linux-vulkan --max-diff-fraction 0.40 --max-high-delta-fraction 0.02
      - run:
          name: Billiard per-backend startup matrix
          no_output_timeout: 15m
          command: |
             # Each backend runs the same physics regression from the one
             # executable; physics-passed + a window capture prove startup,
             # simulation, and backend-correct capture/quit dispatch.
             for backend in opengl vulkan; do
               out="billiard-matrix/$backend"; mkdir -p "$out"
               if [ "$backend" = vulkan ]; then
                 lvp=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json 2>/dev/null | head -n1)
                 if [ -n "$lvp" ]; then export VK_ICD_FILENAMES="$lvp"; fi
                 export VK_LAYER_PATH=/usr/share/vulkan/explicit_layer.d
               fi
               LIBGL_ALWAYS_SOFTWARE=1 timeout --kill-after=5s 720s \
                 xvfb-run -a -s "-screen 0 1280x1024x24 +extension GLX" \
                 bash scripts/capture_billiard_linux.sh "$out" --rhi "$backend" \
                 > "$out/capture.log" 2>&1 || { cat "$out/capture.log" "$out/billiard.log" 2>/dev/null; exit 1; }
               test -s "$out/physics-passed"
               test -s "$out/billiard-after.png"
               echo "linux-billiard-$backend: startup + physics + capture OK"
             done
      - store_artifacts:
          path: billiard-matrix
          destination: billiard-matrix
      - run:
          name: Same-backend reconstruction matrix
          no_output_timeout: 25m
          command: |
             # Two same-backend destroy/recreate cycles run after the first
             # presented frame; captures must still match the startup baseline
             # (CPU scene preserved, GPU resources rebuilt). OpenGL recreates
             # the SDL window; Vulkan rebuilds on the existing XCB window.
             set -e
             baseline="screenshots/viewer-render.png"
             test -s "$baseline"
             for backend in opengl vulkan; do
               out="screenshots/reconstruct/$backend"; mkdir -p "$out"
               if [ "$backend" = vulkan ]; then
                 lvp=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json 2>/dev/null | head -n1)
                 if [ -n "$lvp" ]; then export VK_ICD_FILENAMES="$lvp"; fi
                 export VK_LAYER_PATH=/usr/share/vulkan/explicit_layer.d
                 timeout --kill-after=5s 240s \
                   xvfb-run -a -s "-screen 0 1280x1024x24 +extension GLX" \
                   ./build/Viewer/Viewer --rhi vulkan --rhi-reconstruct 2 -screenshot "$PWD/$out/viewer-render.ppm" \
                   > "$out/viewer.log" 2>&1 || true
                 if [ ! -s "$out/viewer-render.ppm" ]; then
                   echo "=== linux-reconstruct-vulkan viewer.log ==="; cat "$out/viewer.log" || true; exit 1
                 fi
                 grep -q "Vulkan application framebuffer capture saved:" "$out/viewer.log"
                 grep -q "RHI session reconstructed (cycle 2)" "$out/viewer.log"
                 python3 scripts/compare_captures.py "$baseline" "$out/viewer-render.ppm" --label linux-reconstruct-vulkan --max-diff-fraction 0.40 --max-high-delta-fraction 0.02
               else
                 LIBGL_ALWAYS_SOFTWARE=1 timeout --kill-after=5s 180s \
                   xvfb-run -a -s "-screen 0 1280x1024x24 +extension GLX" \
                   bash scripts/capture_viewer_linux.sh "$out" --rhi opengl --rhi-reconstruct 2 \
                   > "$out/capture.log" 2>&1 || { cat "$out/capture.log" "$out/viewer.log" 2>/dev/null; exit 1; }
                 grep -q "RHI session reconstructed (cycle 2)" "$out/viewer.log"
                 python3 scripts/compare_captures.py "$baseline" "$out/viewer-render.png" --label linux-reconstruct-opengl
               fi
               bout="billiard-reconstruct/$backend"; mkdir -p "$bout"
               LIBGL_ALWAYS_SOFTWARE=1 timeout --kill-after=5s 720s \
                 xvfb-run -a -s "-screen 0 1280x1024x24 +extension GLX" \
                 bash scripts/capture_billiard_linux.sh "$bout" --rhi "$backend" --rhi-reconstruct 2 \
                 > "$bout/capture.log" 2>&1 || { cat "$bout/capture.log" "$bout/billiard.log" 2>/dev/null; exit 1; }
               test -s "$bout/physics-passed"
               test -s "$bout/billiard-after.png"
               grep -q "RHI session reconstructed (cycle 2)" "$bout/billiard.log"
               echo "linux-reconstruct-$backend: viewer + billiard reconstruction OK"
             done
      - store_artifacts:
          path: screenshots/reconstruct
          destination: screenshots-reconstruct
      - store_artifacts:
          path: billiard-reconstruct
          destination: billiard-reconstruct
      - run:
          name: Coverage (llvm-cov)
          command: |
             # clang-tools provides clang-scan-deps, which CMake >= 3.28 uses
             # for C++ module dependency scanning with Clang + Ninja.
             sudo apt-get -o Acquire::Retries=3 install -y --fix-missing llvm clang-tools-18
             # clang selects the newest GCC toolchain on the image, which may
             # ship without libstdc++ dev files; pin one that can link C++.
             for d in /usr/lib/gcc/x86_64-linux-gnu/*/; do
               if [ -e "${d}libstdc++.so" ]; then
                 export CFLAGS="--gcc-install-dir=${d%/}" CXXFLAGS="--gcc-install-dir=${d%/}"
                 break
               fi
             done
             ./scripts/coverage_linux.sh build-coverage coverage
             if [ -n "$CODECOV_TOKEN" ]; then
               curl -fsSL https://cli.codecov.io/latest/linux/codecov -o codecov
               chmod +x codecov
               ./codecov upload-process --token "$CODECOV_TOKEN" --file coverage/lcov.info \
                 --sha "$CIRCLE_SHA1" --branch "$CIRCLE_BRANCH" || echo "Codecov upload failed"
             else
               echo "CODECOV_TOKEN not set; skipping Codecov upload"
             fi
      - store_artifacts:
          path: coverage
          destination: coverage
      - store_artifacts:
          path: billiard-screenshots
          destination: billiard-screenshots
      - store_artifacts:
          path: screenshots
          destination: viewer-screenshots
      - when:
          condition:
            or:
              - equal: [ master, << pipeline.git.branch >> ]
              - << pipeline.git.tag >>
          steps:
          - run:
              name: Package
              command: |
                 cmake --build ./build --target package
          - persist_to_workspace:
              root: build
              paths:
                - GEFS-0.1.0-Linux.sh
                - GEFS-0.1.0-Linux.tar.gz
                - GEFS-0.1.0-Linux.tar.Z
          - store_artifacts:
              path: build/GEFS-0.1.0-Linux.sh
          - store_artifacts:
              path: build/GEFS-0.1.0-Linux.tar.gz
          - store_artifacts:
              path: build/GEFS-0.1.0-Linux.tar.Z
      - when:
          condition:
            equal: [full, << parameters.scope >>]
          steps:
            - run:
                name: "Prepare Release dependency cache key"
                command: |
                  cmake -DACTION=key -DCONFIG=Release -P .circleci/unix-dependency-cache.cmake
            - restore_cache:
                key: unix-deps-release-v1-{{ arch }}-{{ checksum ".circleci/unix-deps-key.txt" }}
            - run:
                name: "Build dependencies (Release)"
                command: |
                  if [ -f .circleci/unix-deps-cache-Release/complete.txt ]; then
                    echo "Using cached Release dependencies"
                    cmake -DACTION=restore -DCONFIG=Release -P .circleci/unix-dependency-cache.cmake
                  else
                    ./scripts/build_crossguid.sh Release
                    ./scripts/build_opengex.sh Release
                    ./scripts/build_bullet.sh Release
                    ./scripts/build_glslangValidator.sh Release
                    ./scripts/build_spirvcross.sh Release
                    ./scripts/build_libispc-texcomp.sh Release
                    ./scripts/build_openal.sh Release
                    cmake -DACTION=save -DCONFIG=Release -P .circleci/unix-dependency-cache.cmake
                  fi
            - save_cache:
                key: unix-deps-release-v1-{{ arch }}-{{ checksum ".circleci/unix-deps-key.txt" }}
                paths:
                  - ".circleci/unix-deps-cache-Release"
            - run:
                name: "Build Engine (Release)"
                command: |
                  cmake -S . -B build-release -G Ninja -DCMAKE_BUILD_TYPE=Release \
                    -DUSE_ENGINE_ALLOCATORS=ON -DENABLE_ALLOCATOR_TRACKING=ON \
                    -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
                  cmake --build build-release
            - run:
                name: "Test (Release)"
                command: |
                  ctest --test-dir build-release --output-on-failure --output-junit junit.xml
            - store_test_results:
                path: build-release/junit.xml
  build_macos:
    parameters:
      scope:
        type: enum
        enum: [quick, full]
        default: full
      ctest_args:
        type: string
        default: ""
    environment:
      CCACHE_MAXSIZE: 2G
    macos:
      xcode: "16.4.0"
    resource_class: m4pro.medium
    steps:
      - cache_period_unix
      - restore_cache:
          keys:
            - source-v2-{{ arch }}-{{ checksum "/tmp/cache-period.txt" }}
            - source-v2-{{ arch }}-
      - run:
          name: restore repo
          command: |
            if [ -d ".git" ]; then
              git restore .
            fi
      - checkout
      - run:
          name: init submodules
          command: |
            git submodule sync
            git submodule update --init --recursive
      - when:
          condition:
            equal: [ master, << pipeline.git.branch >> ]
          steps:
            - run:
                name: git gc
                command: |
                  git gc
            - save_cache:
                key: source-v2-{{ arch }}-{{ checksum "/tmp/cache-period.txt" }}
                paths:
                  - ".git"
      - run: 
          name: Install Dependencies via Homebrew
          command: |
             export HOMEBREW_NO_AUTO_UPDATE=1
             brew install cmake ninja flex bison ccache vulkan-headers vulkan-loader
             echo "export PATH=\"$(brew --prefix bison)/bin:$(brew --prefix flex)/bin:\$PATH\"" >> "$BASH_ENV"
      - restore_cache:
          keys:
            - ccache-macos-v2-{{ arch }}-{{ checksum "/tmp/cache-period.txt" }}
            - ccache-macos-v2-{{ arch }}-
      - run:
          name: ISPC and C++ math regression
          command: |
             cmake -S Test/Runtime -B build-runtime -G Ninja -DCMAKE_BUILD_TYPE=Debug
             cmake --build build-runtime --parallel 2
             ctest --test-dir build-runtime --output-on-failure
             ./scripts/build_ispc.sh
             cmake -S Test/GeomMath -B build-geommath -G Ninja -DCMAKE_BUILD_TYPE=Release
             cmake --build build-geommath --parallel 2
             ctest --test-dir build-geommath --output-on-failure --output-junit junit.xml
      - store_test_results:
          path: build-geommath/junit.xml
      - run:
          name: "Build Dependencies"
          command: |
             ./scripts/build_imgui.sh
             ./scripts/build_crossguid.sh
             ./scripts/build_opengex.sh
             ./scripts/build_zlib.sh
             ./scripts/build_bullet.sh
             ./scripts/build_glslangValidator.sh
             ./scripts/build_spirvcross.sh
             ./scripts/build_libispc-texcomp.sh
             ./scripts/build_openal.sh
      - run:
          name: "Build Engine"
          command: |
             CMAKE_ARGS="-DUSE_ENGINE_ALLOCATORS=ON -DENABLE_ALLOCATOR_TRACKING=ON -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache" ./scripts/build-ninja.sh
      - when:
          condition:
            equal: [ master, << pipeline.git.branch >> ]
          steps:
            - save_cache:
                key: ccache-macos-v2-{{ arch }}-{{ checksum "/tmp/cache-period.txt" }}
                paths:
                  - ~/Library/Caches/ccache
      - run:
          name: "Cook Asset"
          command: |
            scripts/cook_material.sh
      - run:
          name: Test
          command: |
             ctest --test-dir ./build --output-on-failure --output-junit junit.xml << parameters.ctest_args >>
      - store_test_results:
          path: build/junit.xml
      - when:
          condition:
            equal: [quick, << parameters.scope >>]
          steps:
            - run: circleci-agent step halt
      - run:
          name: Capture Viewer screenshot
          when: always
          command: |
             # Never fails the job; Viewer renders headlessly and saves one frame itself.
             mkdir -p screenshots
             APP=$(find build -type d -name Viewer.app | head -n 1)
             if [ -z "$APP" ]; then echo "Viewer.app not found"; exit 0; fi
             if ! open -n --stdout "$PWD/screenshots/viewer.log" --stderr "$PWD/screenshots/viewer.log" "$APP" --args -screenshot "$PWD/screenshots/viewer-render.png" -screenshotDelay 60 -screenshotFrame 480 >screenshots/launch.log 2>&1; then
               echo "Viewer launch failed; see screenshots/launch.log"
               exit 0
             fi
             for i in $(seq 1 12); do
               sleep 15
               pgrep -x Viewer >/dev/null || break
             done
             pkill -x Viewer || true
             cp ~/Library/Logs/DiagnosticReports/Viewer* screenshots/ 2>/dev/null || true
             exit 0
      - run:
          name: Viewer scene replacement regression
          no_output_timeout: 10m
          command: |
             APP=$(find build -type d -name Viewer.app | head -n 1)
             test -n "$APP"
             for phase in 1 2; do
               output="$PWD/screenshots/scene-cycle-$phase"
               mkdir -p "$output"
               export GEFS_SCREENSHOT_WAIT_FOR="$output/scene-ready"
               "$APP/Contents/MacOS/Viewer" -sceneCycle "$phase" \
                 -screenshot "$output/viewer-render.png" -screenshotDelay 0 \
                 -screenshotWaitFor "$GEFS_SCREENSHOT_WAIT_FOR" \
                 -screenshotFrame 120 > "$output/viewer.log" 2>&1 &
               viewer_pid=$!
               trap 'kill "$viewer_pid" 2>/dev/null || true' EXIT
               for i in $(seq 1 36); do
                 sleep 5
                 kill -0 "$viewer_pid" 2>/dev/null || break
               done
               if kill -0 "$viewer_pid" 2>/dev/null; then
                 echo "Scene cycle timed out" >&2
                 exit 1
               fi
               wait "$viewer_pid"
               trap - EXIT
               grep -q "SCENE_CYCLE_READY phase=$phase" "$output/viewer.log"
               test -s "$output/viewer-render.png"
             done
             unset GEFS_SCREENSHOT_WAIT_FOR
      - run:
          name: Billiard physics regression and screenshot
          no_output_timeout: 15m
          command: |
             mkdir -p billiard-screenshots
             output="$PWD/billiard-screenshots"
             APP=$(find build -type d -name BilliardGame.app | head -n 1)
             test -n "$APP"
             "$APP/Contents/MacOS/BilliardGame" -physicsRegression "$output" \
               -screenshot "$output/billiard-after.png" -screenshotWaitFor "$output/physics-passed" \
               -screenshotDelay 0 > "$output/billiard.log" 2>&1 &
             billiard_pid=$!
             trap 'kill "$billiard_pid" 2>/dev/null || true' EXIT
             for i in $(seq 1 120); do
               sleep 5
               kill -0 "$billiard_pid" 2>/dev/null || break
             done
             if kill -0 "$billiard_pid" 2>/dev/null; then
               echo "Billiard regression timed out; see billiard.log" >&2
               exit 1
             fi
             wait "$billiard_pid"
             trap - EXIT
             test -s "$output/physics-passed"
             test -s "$output/billiard-after.png"
      - when:
          condition:
            equal: [<< parameters.scope >>, full]
          steps:
            - run:
                name: Viewer startup matrix and capture comparison
                no_output_timeout: 15m
                command: |
                   set -e
                   baseline="screenshots/viewer-render.png"
                   test -s "$baseline"
                   APP=$(find build -type d -name Viewer.app | head -n 1)
                   test -n "$APP"
                   for backend in metal vulkan; do
                     out="screenshots/matrix/$backend"; mkdir -p "$out"
                     ext=png
                     if [ "$backend" = vulkan ]; then
                       ext=ppm
                       # Debug builds require validation layers; mirror the
                       # MoltenVK verification step's brew environment. The late
                       # loader dlopens libvulkan by leaf name, and brew's prefix
                       # is not in dyld's default path on Apple Silicon.
                       export HOMEBREW_NO_AUTO_UPDATE=1
                       brew install molten-vk vulkan-validationlayers spirv-tools
                       export VK_DRIVER_FILES="$(brew --prefix molten-vk)/etc/vulkan/icd.d/MoltenVK_icd.json"
                       export VK_ICD_FILENAMES="$VK_DRIVER_FILES"
                       export VK_LAYER_PATH="$(brew --prefix vulkan-validationlayers)/share/vulkan/explicit_layer.d"
                       export DYLD_FALLBACK_LIBRARY_PATH="$(brew --prefix vulkan-validationlayers)/lib:$(brew --prefix molten-vk)/lib:$(brew --prefix vulkan-loader)/lib${DYLD_FALLBACK_LIBRARY_PATH:+:$DYLD_FALLBACK_LIBRARY_PATH}"
                       export DYLD_LIBRARY_PATH="$(brew --prefix)/lib${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}"
                     fi
                     "$APP/Contents/MacOS/Viewer" --rhi "$backend" \
                       -screenshot "$PWD/$out/viewer-render.$ext" -screenshotDelay 60 -screenshotFrame 480 \
                       > "$out/viewer.log" 2>&1 &
                     viewer_pid=$!
                     for i in $(seq 1 16); do
                       sleep 15
                       kill -0 "$viewer_pid" 2>/dev/null || break
                     done
                     kill "$viewer_pid" 2>/dev/null || true
                     wait "$viewer_pid" 2>/dev/null || true
                     if [ ! -s "$out/viewer-render.$ext" ]; then
                       echo "=== macos-$backend viewer.log ==="
                       cat "$out/viewer.log" || true
                       exit 1
                     fi
                     tol=""
                     if [ "$backend" = vulkan ]; then tol="--max-diff-fraction 0.40 --max-high-delta-fraction 0.02"; fi
                     python3 scripts/compare_captures.py "$baseline" "$out/viewer-render.$ext" --label "macos-$backend" $tol
                   done
      - run:
          name: Billiard per-backend startup matrix
          no_output_timeout: 20m
          command: |
             set -e
             APP=$(find build -type d -name BilliardGame.app | head -n 1)
             test -n "$APP"
             for backend in metal vulkan; do
               out="billiard-matrix/$backend"; mkdir -p "$out"
               if [ "$backend" = vulkan ]; then
                 export HOMEBREW_NO_AUTO_UPDATE=1
                 brew install molten-vk vulkan-validationlayers spirv-tools
                 export VK_DRIVER_FILES="$(brew --prefix molten-vk)/etc/vulkan/icd.d/MoltenVK_icd.json"
                 export VK_ICD_FILENAMES="$VK_DRIVER_FILES"
                 export VK_LAYER_PATH="$(brew --prefix vulkan-validationlayers)/share/vulkan/explicit_layer.d"
                 export DYLD_FALLBACK_LIBRARY_PATH="$(brew --prefix vulkan-validationlayers)/lib:$(brew --prefix molten-vk)/lib:$(brew --prefix vulkan-loader)/lib${DYLD_FALLBACK_LIBRARY_PATH:+:$DYLD_FALLBACK_LIBRARY_PATH}"
                 export DYLD_LIBRARY_PATH="$(brew --prefix)/lib${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}"
                 shot="$PWD/$out/billiard.ppm"
                 GEFS_SCREENSHOT_WAIT_FOR="$PWD/$out/physics-passed" \
                   "$APP/Contents/MacOS/BilliardGame" --rhi vulkan -physicsRegression "$PWD/$out" \
                   -screenshot "$shot" > "$out/billiard.log" 2>&1 &
               else
                 shot="$PWD/$out/billiard.png"
                 "$APP/Contents/MacOS/BilliardGame" --rhi metal -physicsRegression "$PWD/$out" \
                   -screenshot "$shot" -screenshotWaitFor "$PWD/$out/physics-passed" -screenshotDelay 0 \
                   > "$out/billiard.log" 2>&1 &
               fi
               pid=$!
               for i in $(seq 1 120); do
