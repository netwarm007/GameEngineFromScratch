               if [ ! -s "$out/physics-passed" ] || [ ! -s "$shot" ]; then
                 echo "=== macos-billiard-$backend billiard.log ==="; cat "$out/billiard.log" || true
                 exit 1
               fi
               echo "macos-billiard-$backend: startup + physics + capture OK"
             done
      - run:
          name: Same-backend reconstruction matrix
          no_output_timeout: 25m
          command: |
             # Two same-backend destroy/recreate cycles run after the first
             # presented frame; captures must still match the startup baseline
             # (CPU scene preserved, GPU resources rebuilt). Metal and Vulkan
             # rebuild on the existing Cocoa window.
             set -e
             baseline="screenshots/viewer-render.png"
             test -s "$baseline"
             APP=$(find build -type d -name Viewer.app | head -n 1)
             test -n "$APP"
             BAPP=$(find build -type d -name BilliardGame.app | head -n 1)
             test -n "$BAPP"
             for backend in metal vulkan; do
               out="screenshots/reconstruct/$backend"; mkdir -p "$out"
               ext=png
               if [ "$backend" = vulkan ]; then
                 ext=ppm
                 export HOMEBREW_NO_AUTO_UPDATE=1
                 brew install molten-vk vulkan-validationlayers spirv-tools
                 export VK_DRIVER_FILES="$(brew --prefix molten-vk)/etc/vulkan/icd.d/MoltenVK_icd.json"
                 export VK_ICD_FILENAMES="$VK_DRIVER_FILES"
                 export VK_LAYER_PATH="$(brew --prefix vulkan-validationlayers)/share/vulkan/explicit_layer.d"
                 export DYLD_FALLBACK_LIBRARY_PATH="$(brew --prefix vulkan-validationlayers)/lib:$(brew --prefix molten-vk)/lib:$(brew --prefix vulkan-loader)/lib${DYLD_FALLBACK_LIBRARY_PATH:+:$DYLD_FALLBACK_LIBRARY_PATH}"
                 export DYLD_LIBRARY_PATH="$(brew --prefix)/lib${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}"
               fi
               "$APP/Contents/MacOS/Viewer" --rhi "$backend" --rhi-reconstruct 2 \
                 -screenshot "$PWD/$out/viewer-render.$ext" -screenshotDelay 60 -screenshotFrame 480 \
                 > "$out/viewer.log" 2>&1 &
               viewer_pid=$!
               for i in $(seq 1 16); do
                 sleep 15
                 kill -0 "$viewer_pid" 2>/dev/null || break
               done
               kill "$viewer_pid" 2>/dev/null || true
               wait "$viewer_pid" 2>/dev/null || true
               if [ ! -s "$out/viewer-render.$ext" ]; then
                 echo "=== macos-reconstruct-$backend viewer.log ==="; cat "$out/viewer.log" || true; exit 1
               fi
               grep -q "RHI session reconstructed (cycle 2)" "$out/viewer.log"
               tol=""
               if [ "$backend" = vulkan ]; then tol="--max-diff-fraction 0.40 --max-high-delta-fraction 0.02"; fi
               python3 scripts/compare_captures.py "$baseline" "$out/viewer-render.$ext" --label "macos-reconstruct-$backend" $tol
               bout="billiard-reconstruct/$backend"; mkdir -p "$bout"
               if [ "$backend" = vulkan ]; then
                 shot="$PWD/$bout/billiard.ppm"
                 GEFS_SCREENSHOT_WAIT_FOR="$PWD/$bout/physics-passed" \
                   "$BAPP/Contents/MacOS/BilliardGame" --rhi vulkan --rhi-reconstruct 2 -physicsRegression "$PWD/$bout" \
                   -screenshot "$shot" > "$bout/billiard.log" 2>&1 &
               else
                 shot="$PWD/$bout/billiard.png"
                 "$BAPP/Contents/MacOS/BilliardGame" --rhi metal --rhi-reconstruct 2 -physicsRegression "$PWD/$bout" \
                   -screenshot "$shot" -screenshotWaitFor "$PWD/$bout/physics-passed" -screenshotDelay 0 \
                   > "$bout/billiard.log" 2>&1 &
               fi
               pid=$!
               for i in $(seq 1 120); do
                 sleep 5
                 kill -0 "$pid" 2>/dev/null || break
               done
               kill "$pid" 2>/dev/null || true
               wait "$pid" 2>/dev/null || true
               if [ ! -s "$bout/physics-passed" ] || [ ! -s "$shot" ]; then
                 echo "=== macos-billiard-reconstruct-$backend billiard.log ==="; cat "$bout/billiard.log" || true
                 exit 1
               fi
               grep -q "RHI session reconstructed (cycle 2)" "$bout/billiard.log"
               echo "macos-reconstruct-$backend: viewer + billiard reconstruction OK"
             done
      - store_artifacts:
          path: screenshots/reconstruct
          destination: screenshots-reconstruct
      - store_artifacts:
          path: billiard-reconstruct
          destination: billiard-reconstruct
      - run:
          name: RHI selection diagnostics smoke
          command: |
             set -e
             VAPP=$(find build -type d -name Viewer.app | head -n 1)
             test -n "$VAPP"
             "$VAPP/Contents/MacOS/Viewer" --list-rhi | tee rhi-list.txt
             grep -q "opengl" rhi-list.txt || grep -q "metal" rhi-list.txt
             if "$VAPP/Contents/MacOS/Viewer" --rhi bogus > rhi-unknown.txt 2>&1; then
               echo "invalid --rhi unexpectedly succeeded"; exit 1; fi
             grep -q "Unknown RHI 'bogus'" rhi-unknown.txt
             if "$VAPP/Contents/MacOS/Viewer" --rhi metal --rhi vulkan > rhi-dup.txt 2>&1; then
               echo "repeated --rhi unexpectedly succeeded"; exit 1; fi
             grep -q "only once" rhi-dup.txt
      - store_artifacts:
          path: billiard-matrix
          destination: billiard-matrix
      - store_artifacts:
          path: billiard-screenshots
          destination: billiard-screenshots
      - store_artifacts:
          path: screenshots
          destination: viewer-screenshots
      - when:
          condition:
            or:
              - equal: [ master, << pipeline.git.branch >> ]
              - << pipeline.git.tag >>
          steps:
          - run:
              name: Package
              command: |
                 cmake --build ./build --target package
          - persist_to_workspace:
              root: build
              paths:
                - GEFS-0.1.0-Darwin.sh
                - GEFS-0.1.0-Darwin.tar.gz
          - store_artifacts:
              path: build/GEFS-0.1.0-Darwin.sh
          - store_artifacts:
              path: build/GEFS-0.1.0-Darwin.tar.gz
      - run:
          name: Compile opt-in Vulkan applications and verify bundle asset refresh
          command: |
             export HOMEBREW_NO_AUTO_UPDATE=1
             cmake -S . -B build-vulkan-apps -G Ninja -DCMAKE_BUILD_TYPE=Debug \
               -DVULKAN_APPLICATIONS=ON -DCMAKE_CUDA_COMPILER=NOTFOUND
             cmake --build build-vulkan-apps --target Viewer BilliardGame --parallel 2
             cmake -E rm -f build-vulkan-apps/Viewer/Viewer.app/Contents/Resources/Asset/Shaders/Vulkan/Engine/pbr.frag.spv
             cmake --build build-vulkan-apps --target Viewer --parallel 2
             cmp build-vulkan-apps/Asset/Shaders/Vulkan/Engine/pbr.frag.spv \
               build-vulkan-apps/Viewer/Viewer.app/Contents/Resources/Asset/Shaders/Vulkan/Engine/pbr.frag.spv
      - run:
          name: Verify explicit MoltenVK rendering and native presentation
          command: |
             export HOMEBREW_NO_AUTO_UPDATE=1
             brew install molten-vk vulkan-validationlayers spirv-tools
             brew list --versions molten-vk vulkan-headers vulkan-loader vulkan-validationlayers
             export VK_DRIVER_FILES="$(brew --prefix molten-vk)/etc/vulkan/icd.d/MoltenVK_icd.json"
             export VK_ICD_FILENAMES="$VK_DRIVER_FILES"
             export VK_LAYER_PATH="$(brew --prefix vulkan-validationlayers)/share/vulkan/explicit_layer.d"
             export DYLD_FALLBACK_LIBRARY_PATH="$(brew --prefix vulkan-validationlayers)/lib:$(brew --prefix molten-vk)/lib:$(brew --prefix vulkan-loader)/lib${DYLD_FALLBACK_LIBRARY_PATH:+:$DYLD_FALLBACK_LIBRARY_PATH}"
             test -r "$VK_DRIVER_FILES"
             test -r "$VK_LAYER_PATH/VkLayer_khronos_validation.json"
             cmake -S Test/RHI/Vulkan -B build-vulkan-abi -G Ninja -DCMAKE_BUILD_TYPE=Debug \
               -DGLSL_VALIDATOR="$PWD/External/Darwin/bin/glslang" \
               -DSPIRV_CROSS="$PWD/External/Darwin/bin/spirv-cross" \
               -DZLIB_ROOT="$PWD/External/Darwin"
             cmake --build build-vulkan-abi --parallel 2
             ctest --test-dir build-vulkan-abi -V --output-junit junit.xml
             bash scripts/capture_vulkan_applications.sh moltenvk-applications
      - store_test_results:
          path: build-vulkan-abi/junit.xml
      - store_artifacts:
          path: build-vulkan-abi/Testing
          destination: moltenvk-verification
      - store_artifacts:
          path: build-vulkan-abi/vulkan-images
          destination: moltenvk-images
      - store_artifacts:
          path: moltenvk-applications
          destination: moltenvk-applications
      - when:
          condition:
            equal: [full, << parameters.scope >>]
          steps:
            - run:
                name: "Build dependencies (Release)"
                command: |
                  ./scripts/build_crossguid.sh Release
                  ./scripts/build_opengex.sh Release
                  ./scripts/build_zlib.sh Release
                  ./scripts/build_bullet.sh Release
                  ./scripts/build_glslangValidator.sh Release
                  ./scripts/build_spirvcross.sh Release
                  ./scripts/build_libispc-texcomp.sh Release
                  ./scripts/build_openal.sh Release
            - run:
                name: "Build Engine (Release)"
                command: |
                  cmake -S . -B build-release -G Ninja -DCMAKE_BUILD_TYPE=Release \
                    -DUSE_ENGINE_ALLOCATORS=ON -DENABLE_ALLOCATOR_TRACKING=ON \
                    -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
                  cmake --build build-release
            - run:
                name: "Test (Release)"
                command: |
                  ctest --test-dir build-release --output-on-failure --output-junit junit.xml
            - store_test_results:
                path: build-release/junit.xml
  build_android:
    working_directory: ~/project
    docker:
      - image: cimg/android:2022.09-ndk
    resource_class: large
    environment:
      JVM_OPTS: -Xmx3200m
    steps:
      - run:
          name: Install Git LFS
          command: |
            curl -s https://packagecloud.io/install/repositories/github/git-lfs/script.deb.sh | sudo bash
            sudo apt install -y git-lfs
      - run:
          name: Install cmake
          command: |
            wget -O - https://apt.kitware.com/keys/kitware-archive-latest.asc 2>/dev/null | gpg --dearmor - | sudo tee /usr/share/keyrings/kitware-archive-keyring.gpg >/dev/null
            echo 'deb [signed-by=/usr/share/keyrings/kitware-archive-keyring.gpg] https://apt.kitware.com/ubuntu/ focal main' | sudo tee /etc/apt/sources.list.d/kitware.list >/dev/null
            sudo apt-get update
            sudo rm /usr/share/keyrings/kitware-archive-keyring.gpg
            sudo apt-get install kitware-archive-keyring
            sudo apt install -y cmake=3.23.2-0kitware1ubuntu20.04.1 cmake-data=3.23.2-0kitware1ubuntu20.04.1
      - run:
          name: Install Dependencies
          command: |
            sudo apt install -y ninja-build bison flex libncurses5
      - run:
          name: Install LLVM 13
          command: |
            wget https://apt.llvm.org/llvm.sh
            chmod +x llvm.sh
            sudo ./llvm.sh 13
            rm ./llvm.sh
      #- restore_cache:
      #    keys:
      #      - source-android-{{ .Branch }}-{{ .Revision }}
      #      - source-android-{{ .Branch }}-
      #      - source-android-
      - checkout
      - run:
          name: init submodules
          command: |
            git submodule sync
            git submodule update --init --recursive
      - restore_cache:
          key: jars-{{ checksum "Game/Billiard/build.gradle" }}-{{ checksum  "Game/Billiard/app/build.gradle" }}
      - run:
          name: Download Dependencies
          command: |
                   ./gradlew androidDependencies
          working_directory: Game/Billiard
      - save_cache:
          paths:
            - Game/Billiard/.gradle
          key: jars-{{ checksum "Game/Billiard/build.gradle" }}-{{ checksum  "Game/Billiard/app/build.gradle" }}
      - run:
          name: Build External Dependencies
          command: |
                   ./scripts/build_crossguid-android.sh
                   ./scripts/build_opengex-android.sh
                   ./scripts/build_bullet-android.sh
                   ./scripts/build_zlib-android.sh
                   ./scripts/build_openal-android.sh
                   ./scripts/build_glslangValidator.sh
                   ./scripts/build_spirvcross.sh
      - run:
          name: Build
          command: |
                   ./gradlew build
          working_directory: Game/Billiard
      - store_artifacts:
          path: Game/Billiard/app/build/reports
          destination: reports
      - store_artifacts:
          path: Game/Billiard/app/build/test-results
          destination: test-results
      - store_artifacts:
          path: Game/Billiard/app/build/outputs/apk
          destination: apk
  publish_github_release:
    docker:
      - image: cibuilds/github:0.10
    steps:
      - attach_workspace:
          at: ./artifacts
      - run:
          name: "Publish Release on GitHub"
          command: |
            VERSION=0.1.0
            ghr -t ${GITHUB_TOKEN} -u ${CIRCLE_PROJECT_USERNAME} -r ${CIRCLE_PROJECT_REPONAME} -c ${CIRCLE_SHA1} -delete ${VERSION} ./artifacts/
workflows:
  version: 2
  build-and-test: #default on push; acceptance
    when: << pipeline.parameters.run_full >>
    jobs:
      - build_windows
      - build_linux
      - build_macos
      #- build_android
  quick-windows: #iteration: API-triggered with run_full=false
    when:
      and:
        - not: << pipeline.parameters.run_full >>
        - matches: { pattern: ".*windows.*", value: << pipeline.parameters.platforms >> }
    jobs:
      - build_windows:
          scope: quick
          ctest_args: "-L fast"
  quick-linux:
    when:
      and:
        - not: << pipeline.parameters.run_full >>
        - matches: { pattern: ".*linux.*", value: << pipeline.parameters.platforms >> }
    jobs:
      - build_linux:
          scope: quick
          ctest_args: "-L fast"
  quick-macos:
    when:
      and:
        - not: << pipeline.parameters.run_full >>
        - matches: { pattern: ".*macos.*", value: << pipeline.parameters.platforms >> }
    jobs:
      - build_macos:
          scope: quick
          ctest_args: "-L fast"
  build-and-test-and-release: #for tags
    jobs:
      - build_windows:
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^\d+\.\d+\.\d+$/
      - build_linux:
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^\d+\.\d+\.\d+$/
      - build_macos:
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^\d+\.\d+\.\d+$/
      - publish_github_release:
          requires:
            - build_linux
            - build_macos
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^\d+\.\d+\.\d+$/
